name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Foundry format, build, unit, fuzz, invariants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: Format
        run: forge fmt --check
      - name: Build and report sizes
        run: forge build --sizes
      - name: Unit and fuzz tests
        run: forge test -vvv
      - name: High-intensity invariant profile
        run: FOUNDRY_PROFILE=ci forge test -vvv

  javascript:
    name: Web, API, indexer checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.26.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Install Chromium for browser smoke tests
        run: pnpm --filter @micow/web exec playwright install --with-deps chromium
      - name: Browser smoke tests
        run: pnpm --filter @micow/web test:e2e
      - name: Production build
        run: pnpm build

  postgres-integration:
    name: PostgreSQL idempotency, reorg, and API integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: micow
          POSTGRES_PASSWORD: micow
          POSTGRES_DB: micow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U micow -d micow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql://micow:micow@localhost:5432/micow
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 10.26.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.0
          cache: pnpm
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Indexer PostgreSQL integration tests
        run: pnpm --filter @micow/indexer test:integration
      - name: API PostgreSQL integration tests
        run: pnpm --filter @micow/api test:integration
      - name: Indexer process-level RPC outage and restart test
        run: pnpm --filter @micow/indexer test:process

  testnet-preflight:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    name: Robinhood Testnet RPC and deployment simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RH_TESTNET_RPC_URL: https://rpc.testnet.chain.robinhood.com
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: Verify target chain
        run: |
          actual="$(cast chain-id --rpc-url "$RH_TESTNET_RPC_URL")"
          test "$actual" = "46630"
          printf 'Verified Robinhood Chain Testnet ID: %s\n' "$actual"
      - name: Simulate deployment without broadcasting
        shell: bash
        run: |
          set -euo pipefail
          DEPLOYER_PRIVATE_KEY="0x$(openssl rand -hex 32)"
          echo "::add-mask::$DEPLOYER_PRIVATE_KEY"
          export DEPLOYER_PRIVATE_KEY
          export PROTOCOL_FEE_RECIPIENT=0x0000000000000000000000000000000000000001
          forge build --sizes
          forge script contracts/script/DeployTestnet.s.sol:DeployTestnet --rpc-url "$RH_TESTNET_RPC_URL" -vvv

  repository-hygiene:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
