[profile.default]
src = "contracts/src"
test = "contracts/test"
script = "contracts/script"
out = "contracts/out"
libs = ["contracts/lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz.runs = 512
invariant.runs = 256
invariant.depth = 64
bytecode_hash = "ipfs"

[profile.ci]
fuzz.runs = 2048
invariant.runs = 512
invariant.depth = 128

[rpc_endpoints]
robinhood_testnet = "${RH_TESTNET_RPC_URL}"

[etherscan]
robinhood_testnet = { key = "${EXPLORER_API_KEY}", url = "https://explorer.testnet.chain.robinhood.com/api/" }
